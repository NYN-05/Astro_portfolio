name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1" # Weekly on Monday

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Run TypeScript/Astro type checking
        run: npm run check

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format

      - name: Build Astro site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Verify build output integrity
        run: |
          echo "Verifying build output..."
          test -f dist/index.html || exit 1
          test -f dist/resume/index.html || exit 1
          test -f dist/404.html || exit 1
          test -f dist/_headers || exit 1
          test -f dist/robots.txt || exit 1
          echo "Build verification passed."

  # Security scan job
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (full report)
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "Critical/High vulnerabilities found: Critical=$CRITICAL, High=$HIGH"
            exit 1
          fi

  # Optional: Deploy preview on PR
  deploy-preview:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Astro site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
