version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      development-dependencies:
        patterns:
          - "@astrojs/*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "astro-eslint-parser"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "astro"
          - "@astrojs/sitemap"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-type: "version-update:semver-major"
